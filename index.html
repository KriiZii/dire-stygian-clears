<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dire Stygian Clears</title>
  <link rel="icon" type="image/jpeg" href="https://act-upload.hoyoverse.com/event-ugc-hoyowiki/2025/07/14/41133912/b6287b34deb1f4d12e0be0599584cc70_855379148837321239.png?x-oss-process=image%2Fformat%2Cwebp">
  <link rel="stylesheet" href="dire-stygian-clears.css">
</head>
<body>

<header>
  <div id="byline">
    <span>Made by Krizi</span>
    <span id="clearCount" class="header-badge"></span>
    <span id="patchBadge" class="header-badge">Luna VII/6.6</span>
  </div>
  <h1>Dire Stygian Clears</h1>
  <div id="filters">
    <span id="discordHint">Join if you want to add/submit clears -></span>
    <a href="https://discord.gg/H2p86JdFeJ" target="_blank" class="header-badge" id="discordBtn">Discord</a>
    <button id="themeToggle" class="header-badge">&#9728; Light</button>
  </div>
</header>

<div id="mobileTabs">
  <button class="mobile-tab active" data-tab="clears">Clears</button>
  <button class="mobile-tab" data-tab="filters">Filters</button>
</div>

<div id="charBar">
  <div id="charSearchRow">
    <div id="charSearchInner">
      <input type="text" id="charSearch" placeholder="Search characters...">
      <button id="charToggle">&#9650;</button>
    </div>
  </div>
  <div id="filterIcons">
    <div id="bossIconsSection">
      <div class="filter-section-label">Boss</div>
      <div id="bossIcons"></div>
    </div>
    <div id="charIconsDivider"></div>
    <div id="charIconsSection">
      <div id="charWeaponTabRow">
        <button class="header-badge filter-tab active" data-filter-tab="chars">Characters</button>
        <button class="header-badge filter-tab" data-filter-tab="weapons">Weapons</button>
        <button id="c0FilterBtn" class="header-badge">C0 5&#9733; only</button>
        <button id="includeStandardBtn" class="header-badge c0-sub-btn" style="visibility:hidden">Include Standard</button>
        <button id="includeFreeConsBtn" class="header-badge c0-sub-btn" style="visibility:hidden">Include Free Cons</button>
        <div id="charTabRightBtns">
          <button id="noSigFilterBtn" class="header-badge" style="display:none">No Signatures</button>
          <button id="selectAllBtn" class="header-badge">Select All</button>
          <button id="unselectAllBtn" class="header-badge">Unselect All</button>
        </div>
      </div>
      <div id="charIcons"></div>
      <div id="weaponIcons" style="display:none"></div>
    </div>
  </div>
</div>

<div id="sortRow">
  <div class="sort-group">
    <button id="sortTimeBtn" class="header-badge">&#9650; Clear Time</button>
    <input type="number" id="timeMin" class="range-input" placeholder="Min" min="0">
    <span class="range-sep">–</span>
    <input type="number" id="timeMax" class="range-input" placeholder="Max" min="0">
    <span class="range-unit">s</span>
  </div>
  <div class="sort-group">
    <button id="sortCostBtn" class="header-badge">&#9650; Cost</button>
    <input type="number" id="costMin" class="range-input" placeholder="Min" min="0">
    <span class="range-sep">–</span>
    <input type="number" id="costMax" class="range-input" placeholder="Max" min="0">
  </div>
</div>

<div id="videoList"></div>

<footer>Game content and materials are property of miHoYo.</footer>

<script src="dire-stygian-clears.js"></script>

</body>
</html>
